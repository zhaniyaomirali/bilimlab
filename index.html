<script>
function openPage(id){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
  if(id==='bio1') resetQuiz1();
  if(id==='bio2') resetQuiz2();
  if(id==='chem1') resetQuiz3();
  if(id==='chem2') resetQuiz4();
}

function createQuiz(quizId, questions, puzzleId){
  let state = {i:0, wrong:[], completed:[], phase:'first'};

  function load(){
    if(state.phase==='first' && state.i>=questions.length){
      if(state.wrong.length>0){
        state.phase='review';
        state.i = state.wrong.shift();
        alert("Қате жауаптарды қайталаңыз");
      } else { finish(); return; }
    }
    if(state.phase==='review'){
      if(state.i===undefined || state.i===null){ state.i = state.wrong.shift(); }
      if(state.i===undefined){ finish(); return; }
    }

    document.getElementById('question'+quizId).innerText = questions[state.i].q;
    let html='';
    const letters = ["A","B","C","D"];

    questions[state.i].o.forEach((opt,index)=>{
        html+=`<label>
            <input type="radio" name="a${quizId}" value="${index}">
            ${letters[index]}) ${opt}
            </label>`;
        });

    document.getElementById('options'+quizId).innerHTML = html;
    document.getElementById('nextBtn'+quizId).disabled = true;
  }

  function check(){
    let sel = document.querySelector(`input[name=a${quizId}]:checked`);
    if(!sel){ alert("Жауапты таңда!"); return; }
    let val = +sel.value;
    let labels = document.querySelectorAll(`#options${quizId} label`);
    labels.forEach(l=>l.classList.remove('correct','wrong'));

    if(val===questions[state.i].c){
      labels[val].classList.add('correct');
      let img = document.querySelector(`#${puzzleId} div[data-index="${state.i}"] img`);
      if(img) img.style.display='block';
      if(!state.completed.includes(state.i)) state.completed.push(state.i);
      state.wrong = state.wrong.filter(x=>x!==state.i);
    } else {
      labels[val].classList.add('wrong');
      if(state.phase==='first' && !state.wrong.includes(state.i)) state.wrong.push(state.i);
    }

    document.getElementById('nextBtn'+quizId).disabled=false;
  }

  function next(){
    if(state.phase==='first'){
      state.i++;
      load();
    } else if(state.phase==='review'){
      
      if(state.wrong.length>0){
        state.i = state.wrong.shift();
        load();
      } else {
        finish();
      }
    }
  }

  function finish(){

    let scoreText = `🎉 Тест аяқталды! Дұрыс жауаптар: ${state.completed.length}/${questions.length}`;

    localStorage.setItem('quizScore', scoreText);

    window.location.href = 'result.html';
}


  function reset(){
    state.i=0; state.wrong=[]; state.completed=[]; state.phase='first';
    document.querySelectorAll(`#${puzzleId} img`).forEach(img=>img.style.display='none');
    document.getElementById('score'+quizId).style.display='none';
    load();
  }

  return {load, check, next, reset};
}
